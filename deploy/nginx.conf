# Reverse proxy TLS devant l'application (Nginx + Certbot).
# Copier dans /etc/nginx/sites-available/datamaturity puis activer le lien symbolique.

server {
    listen 80;
    server_name datamaturity.pro www.datamaturity.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name datamaturity.pro www.datamaturity.pro;

    ssl_certificate     /etc/letsencrypt/live/datamaturity.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datamaturity.pro/privkey.pem;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;

    # Les webhooks de paiement doivent recevoir le corps brut, sans mise en tampon.
    location /paiement/webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # La console d'administration peut être restreinte par adresse IP.
    # location /admin/ {
    #     allow 197.0.0.0/8;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    # }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
