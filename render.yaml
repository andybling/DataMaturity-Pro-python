# Blueprint Render — https://render.com/docs/infrastructure-as-code
#
# Utilisation : dans Render, « New » > « Blueprint », sélectionner ce dépôt.
# Render lit ce fichier, crée la base PostgreSQL et le service web, et génère
# automatiquement SECRET_KEY. Seules les variables marquées sync:false sont à
# saisir dans l'interface (mot de passe admin et clés de paiement).

databases:
  - name: datamaturity-db
    databaseName: datamaturity
    user: datamaturity
    plan: basic-256mb          # remplacer par « free » pour tester (base supprimée après expiration)
    region: frankfurt          # région la plus proche de l'Afrique de l'Ouest

services:
  - type: web
    name: datamaturity-pro
    runtime: python
    plan: starter              # « free » possible pour tester : le service s'endort après 15 min d'inactivité
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      # --- Base de données (injectée par Render, normalisée par l'application) ---
      - key: DATABASE_URL
        fromDatabase:
          name: datamaturity-db
          property: connectionString

      # --- Sécurité ---
      - key: SECRET_KEY
        generateValue: true    # Render génère une valeur aléatoire, jamais visible dans le dépôt
      - key: APP_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # à saisir dans l'interface Render

      # --- Identité commerciale ---
      - key: BASE_URL
        sync: false            # ex. https://datamaturity-pro.onrender.com puis votre domaine
      - key: BRAND_NAME
        value: DataMaturity Pro
      - key: BRAND_OWNER
        value: Yves Mouaha Handy
      - key: CONTACT_EMAIL
        value: yvesmouaha@yahoo.fr
      - key: CONTACT_PHONE
        value: "+225 07 48 78 25 17"
      - key: CONTACT_WHATSAPP
        value: "2250748782517"
      - key: ADMIN_EMAIL
        value: yvesmouaha@yahoo.fr

      # --- Devises ---
      - key: DEFAULT_CURRENCY
        value: XOF
      - key: FX_EUR_TO_XOF
        value: "655.957"
      - key: FX_USD_TO_XOF
        value: "610.0"

      # --- Baromètre ---
      - key: ENABLE_PUBLIC_BENCHMARK
        value: "true"
      - key: MIN_BENCHMARK_SAMPLE
        value: "3"

      # --- Paiements (laisser vide tant que les comptes ne sont pas ouverts) ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_SECRET_KEY
        sync: false
      - key: CINETPAY_MODE
        value: PRODUCTION
